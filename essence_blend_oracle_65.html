  { name: "犬香薷", components: "單萜醇 (沉香醇)", physical: "收斂舒敏、鎮定肌膚、抗菌", emotional: "撫平情緒、鎮靜、給予安撫", meridians: "心經、肺經" },
  { name: "東印度檸檬香茅", components: "單萜醛 (檸檬醛)", physical: "消除乳酸、促進循環、殺菌", emotional: "激勵、復甦、提振、消除疲勞", meridians: "脾經、胃經" }
];

const bottleCountInput = document.getElementById('bottleCount');

bottleCountInput.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') validateAndDraw();
});

function validateAndDraw() {
  const input = document.getElementById('bottleCount');
  const count = parseInt(input.value);
  const errorMsg = document.getElementById('errorMsg');
  
  if (isNaN(count) || count < 1 || count > 10) {
    errorMsg.textContent = '請輸入 1 至 10 之間的數字';
    return;
  }
  errorMsg.textContent = '';
  startDraw(count);
}

function getRandomOils(count) {
  const shuffled = [...essentialOils].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count);
}

function startDraw(count) {
  document.querySelector('.intro-screen').classList.remove('active');
  document.querySelector('.drawing-screen').classList.add('active');
  
  const scrollContainer = document.getElementById('scrollContainer');
  scrollContainer.innerHTML = '';
  
  const allOils = [...essentialOils];
  let currentIndex = 0;
  const selected = getRandomOils(count);
  
  const scrollDuration = 2000;
  const frameInterval = 30;
  const totalFrames = Math.ceil(scrollDuration / frameInterval);
  let frame = 0;
  
  const scrollInterval = setInterval(() => {
    scrollContainer.innerHTML = '';
    
    for (let i = -2; i <= 2; i++) {
      const index = (currentIndex + i + allOils.length) % allOils.length;
      const div = document.createElement('div');
      div.className = 'scroll-item' + (i !== 0 ? ' blur' : '');
      div.textContent = allOils[index].name;
      div.style.transform = `scale(${i === 0 ? 1 : 0.8})`;
      scrollContainer.appendChild(div);
    }
    
    currentIndex = (currentIndex + 1) % allOils.length;
    frame++;
    
    if (frame >= totalFrames) {
      clearInterval(scrollInterval);
      showResults(selected, count);
    }
  }, frameInterval);
}

function showResults(selected, count) {
  document.querySelector('.drawing-screen').classList.remove('active');
  document.querySelector('.results-screen').classList.add('active');
  
  document.getElementById('drawCount').textContent = `已隨機選擇 ${count} 瓶精油`;
  
  const grid = document.getElementById('oilsGrid');
  grid.innerHTML = selected.map((oil, idx) => `
    <div class="oil-card" style="animation-delay: ${idx * 0.05}s;">
      <div class="oil-name">${oil.name}</div>
      <div class="oil-detail"><span class="oil-label">主要成分</span><br>${oil.components}</div>
      <div class="oil-detail"><span class="oil-label">生理療效</span><br>${oil.physical}</div>
      <div class="oil-detail"><span class="oil-label">心理療效</span><br>${oil.emotional}</div>
      <div class="oil-detail"><span class="oil-label">經絡應用</span><br>${oil.meridians}</div>
    </div>
  `).join('');
  
  window.selectedOils = selected;
}

function goBack() {
  document.querySelector('.results-screen').classList.remove('active');
  document.querySelector('.intro-screen').classList.add('active');
  document.getElementById('bottleCount').value = 3;
  document.getElementById('errorMsg').textContent = '';
}

function exportBlend() {
  if (!window.selectedOils) return;
  const text = window.selectedOils.map(oil => `${oil.name}\n成分: ${oil.components}\n生理: ${oil.physical}\n心理: ${oil.emotional}\n經絡: ${oil.meridians}`).join('\n\n---\n\n');
  navigator.clipboard.writeText(text).then(() => {
    alert('配方已複製到剪貼板');
  });
}
</script>
